[package]
name = "kadro"
version = "1.0.0"
description = "Captura de tela rápida para macOS, Windows e Linux"
authors = ["Ivan Freitas Maeda"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "kadro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
percent-encoding = "2"
log = "0.4"
# OCR uses the OS (Vision on macOS, Windows.Media.Ocr on Windows): no models bundled.
# GIF encoding for recordings (MIT/Apache, quantizes with NeuQuant).
gif = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSRange", "NSString", "NSURL", "NSValue"] }
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNObservation", "VNRecognizeTextRequest", "VNTypes", "objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2"
windows = { version = "0.62", features = [
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already pulled in by xcap: Wayland portals (screenshot, screen cast, global
# shortcuts) over D-Bus, PipeWire for the screen cast frames, XCB for X11.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screenshot", "screencast", "global_shortcuts", "pipewire"] }
pipewire = "0.10"
xcb = { version = "1.7", features = ["randr", "shm", "xfixes"] }
futures-util = { version = "0.3", default-features = false }
pollster = "1"
async-io = "2"
libc = "0.2"
# MP4 on Linux: Cisco's OpenH264 (BSD) built from source, and a small MP4 muxer.
openh264 = "0.9"
mp4 = "0.14"
bytes = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Image encoding/cropping is the hot path; keep it fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
