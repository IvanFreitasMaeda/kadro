[package]
name = "kadro"
version = "0.1.0"
description = "Captura de tela rápida para macOS e Windows"
authors = ["Ivan Freitas Maeda"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "kadro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
percent-encoding = "2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Image encoding/cropping is the hot path; keep it fast even in debug builds.
[profile.dev.package."*"]
opt-level = 2
