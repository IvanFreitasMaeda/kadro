<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preferências do Kadro</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main>
      <section>
        <h2>Geral</h2>
        <label class="row">
          <span class="label">Iniciar o Kadro junto com o sistema</span>
          <input type="checkbox" id="autostart" />
        </label>
      </section>
      <section>
        <h2>Atalhos</h2>
        <div class="row">
          <span class="label">Capturar área</span>
          <button class="shortcut" data-kind="area" title="Clique e pressione a nova combinação"></button>
          <button class="reset" data-reset="area" title="Voltar ao padrão">↺</button>
        </div>
        <div class="row">
          <span class="label">Capturar tela inteira</span>
          <button class="shortcut" data-kind="full" title="Clique e pressione a nova combinação"></button>
          <button class="reset" data-reset="full" title="Voltar ao padrão">↺</button>
        </div>
        <div class="row">
          <span class="label">Abrir o histórico</span>
          <button class="shortcut" data-kind="gallery" title="Clique e pressione a nova combinação"></button>
          <button class="reset" data-reset="gallery" title="Voltar ao padrão">↺</button>
        </div>
        <div class="row">
          <span class="label">Gravar tela (iniciar/parar)</span>
          <button class="shortcut" data-kind="record" title="Clique e pressione a nova combinação"></button>
          <button class="reset" data-reset="record" title="Voltar ao padrão">↺</button>
        </div>
        <p id="status" class="hint">Clique num atalho e pressione a nova combinação. <kbd>Esc</kbd> cancela.</p>
      </section>
      <section>
        <h2>Capturas</h2>
        <div class="row">
          <span class="label">Pasta</span>
          <span id="dir" class="path"></span>
          <button id="choose-dir" class="secondary">Alterar…</button>
        </div>
        <div class="row">
          <span class="label">Histórico</span>
          <select id="history-limit" title="Quantas capturas recentes aparecem no histórico">
            <option value="0">Desativado</option>
            <option value="10">Últimas 10</option>
            <option value="30">Últimas 30</option>
            <option value="100">Últimas 100</option>
          </select>
        </div>
      </section>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
