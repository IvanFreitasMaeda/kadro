name: Release

# Publica uma release no GitHub com os instaladores do Mac, do Windows e do Linux.
# Dois jeitos de disparar:
#   - enviar uma tag de versão (ex.: v0.1.0), que precisa ser igual à de src-tauri/tauri.conf.json;
#   - na aba Actions, "Run workflow" na main: usa a versão de tauri.conf.json e cria a tag sozinho.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # (Linux: AppImage, .deb e .rpm; ubuntu-22.04 para rodar em distros mais antigas também.)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
              echo "::error::A tag ($GITHUB_REF_NAME) não bate com a versão do app ($app) em src-tauri/tauri.conf.json."
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Rode a release a partir da main."
              exit 1
            fi
            if gh release view "v$app" >/dev/null 2>&1; then
              echo "::error::A release v$app já existe. Suba a versão em src-tauri/tauri.conf.json antes."
              exit 1
            fi
          fi

      - name: Conferir chave de assinatura das atualizações
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta o secret TAURI_SIGNING_PRIVATE_KEY (Settings → Secrets and variables → Actions). Sem ele o app não consegue se atualizar sozinho."
            exit 1
          fi

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: .github/scripts/linux-deps.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      # Também gera os pacotes de atualização (.app.tar.gz no Mac, o setup .exe no Windows)
      # e as assinaturas .sig que o app confere antes de instalar.
      - run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Nomes fixos, sem a versão, para que os links "latest/download/..." do README sempre funcionem.
      - name: Renomear instaladores
        shell: bash
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "$bundle"/dmg/*.dmg out/Kadro-macOS-AppleSilicon.dmg
            cp "$bundle"/macos/*.app.tar.gz out/Kadro-macOS-AppleSilicon.app.tar.gz
            cp "$bundle"/macos/*.app.tar.gz.sig out/Kadro-macOS-AppleSilicon.app.tar.gz.sig
          elif [ "${{ runner.os }}" = "Linux" ]; then
            arch=$([ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && echo arm64 || echo x86_64)
            cp "$bundle"/appimage/*.AppImage "out/Kadro-Linux-$arch.AppImage"
            cp "$bundle"/appimage/*.AppImage.sig "out/Kadro-Linux-$arch.AppImage.sig"
            cp "$bundle"/deb/*.deb "out/Kadro-Linux-$arch.deb"
            cp "$bundle"/deb/*.deb.sig "out/Kadro-Linux-$arch.deb.sig"
            cp "$bundle"/rpm/*.rpm "out/Kadro-Linux-$arch.rpm"
            cp "$bundle"/rpm/*.rpm.sig "out/Kadro-Linux-$arch.rpm.sig"
          else
            cp "$bundle"/nsis/*.exe out/Kadro-Windows-Setup.exe
            cp "$bundle"/nsis/*.exe.sig out/Kadro-Windows-Setup.exe.sig
            cp "$bundle"/msi/*.msi out/Kadro-Windows.msi
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: kadro-${{ matrix.name }}
          if-no-files-found: error
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # latest.json é o que o app consulta em releases/latest/download/latest.json
      # para saber se há versão nova, de onde baixar e qual assinatura conferir.
      - name: Gerar latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const version = require('./src-tauri/tauri.conf.json').version;
          const base = `https://github.com/${process.env.REPO}/releases/download/v${version}`;
          const entry = (file) => ({
            signature: fs.readFileSync(`dist/${file}.sig`, 'utf8').trim(),
            url: `${base}/${file}`,
          });
          const manifest = {
            version,
            notes: '',
            pub_date: new Date().toISOString(),
            platforms: {
              'darwin-aarch64': entry('Kadro-macOS-AppleSilicon.app.tar.gz'),
              'windows-x86_64': entry('Kadro-Windows-Setup.exe'),
            },
          };
          // Linux: the app looks for "linux-<arch>-<appimage|deb|rpm>" first, so each
          // kind of install updates with its own kind of file.
          for (const [arch, name] of [['x86_64', 'x86_64'], ['aarch64', 'arm64']]) {
            const appimage = entry(`Kadro-Linux-${name}.AppImage`);
            manifest.platforms[`linux-${arch}`] = appimage;
            manifest.platforms[`linux-${arch}-appimage`] = appimage;
            manifest.platforms[`linux-${arch}-deb`] = entry(`Kadro-Linux-${name}.deb`);
            manifest.platforms[`linux-${arch}-rpm`] = entry(`Kadro-Linux-${name}.rpm`);
          }
          fs.writeFileSync('dist/latest.json', JSON.stringify(manifest, null, 2));
          EOF
          rm dist/*.sig
          cat dist/latest.json

      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Kadro $tag" \
            --generate-notes \
            --notes-file .github/release-notes.md
