<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kadro</title>
    <link rel="stylesheet" href="/src/overlay.css" />
  </head>
  <body>
    <img id="shot" alt="" draggable="false" />
    <div id="dim"></div>
    <div id="sel" hidden>
      <div class="handle" data-h="nw"></div>
      <div class="handle" data-h="n"></div>
      <div class="handle" data-h="ne"></div>
      <div class="handle" data-h="e"></div>
      <div class="handle" data-h="se"></div>
      <div class="handle" data-h="s"></div>
      <div class="handle" data-h="sw"></div>
      <div class="handle" data-h="w"></div>
    </div>
    <div id="size" hidden></div>
    <div id="hint">
      Arraste para selecionar · <kbd>F</kbd> tela inteira · <kbd>Esc</kbd> cancelar
    </div>
    <div id="toolbar" hidden>
      <button data-action="full" title="Tela inteira (F)">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
      <span class="sep"></span>
      <button data-action="copy" title="Copiar (Enter ou Ctrl+C)">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></svg>
      </button>
      <button data-action="save" title="Salvar na pasta (Ctrl+S)">
        <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>
      </button>
      <button data-action="saveas" title="Salvar como… (Ctrl+Shift+S)">
        <svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /></svg>
      </button>
      <span class="sep"></span>
      <button data-action="close" title="Cancelar (Esc)">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div id="toast" hidden></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
